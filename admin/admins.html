<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Admins | Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-shell"><aside class="sidebar"><a class="logo" href="../index.html"><span class="logo-mark">RS</span>RastriyaSenaa</a><a class="side-link" href="index.html">Dashboard</a><a class="side-link" href="products.html">Products</a><a class="side-link" href="orders.html">Orders</a><a class="side-link active" href="admins.html">Admins</a><a class="side-link" href="settings.html">Settings</a></aside><main class="admin-main"><div class="admin-top"><h1>Admin Management</h1><button class="btn btn-dark" id="logoutBtn">Logout</button></div><div class="form-card"><h3>Super Admin</h3><p class="muted">Full control: products, orders, admins, settings.</p><hr><h3>Normal Admin</h3><p class="muted">Product and order management according to assigned permissions.</p><button class="btn btn-primary" onclick="document.getElementById('addAdmin').classList.add('open')">+ Add Admin</button></div>
<div id="addAdmin" class="modal"><div class="modal-card"><h2>Create Admin ID</h2><form id="addAdminForm"><div class="form-grid"><div><label>Admin ID</label><input id="newUser" class="input" required></div><div><label>Password</label><input id="newPass" class="input" type="password" required></div><div><label>Role</label><select id="newRole" class="select"><option value="admin">Admin</option><option value="superadmin">Super Admin</option></select></div><div class="full"><label>Permissions</label><input id="perms" class="input" value="products,orders"></div><div class="full"><button class="btn btn-primary">Create Admin</button> <button type="button" class="btn btn-outline" onclick="document.getElementById('addAdmin').classList.remove('open')">Cancel</button></div></div><p id="adminMsg"></p></form></div></div>
<script src="../js/app.js"></script><script>
(function(){const session=requireAdmin();if(!session)return;document.getElementById('logoutBtn').onclick=logoutAdmin;
document.getElementById('addAdminForm').onsubmit=async function(e){e.preventDefault();const msg=document.getElementById('adminMsg');try{const x=await apiPost({action:'createAdmin',token:adminToken(),admin:{username:document.getElementById('newUser').value.trim(),password:document.getElementById('newPass').value,role:document.getElementById('newRole').value,permissions:document.getElementById('perms').value}});msg.textContent=x.message||'Admin created successfully';e.target.reset();document.getElementById('perms').value='products,orders';}catch(err){msg.textContent=err.message}}})();
</script></main></div></body></html>
