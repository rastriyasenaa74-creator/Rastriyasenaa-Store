<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Admin Management | RastriyaSenaa Store</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="admin-shell"><aside class="sidebar"><a class="logo" href="../index.html"><span class="logo-mark">RS</span>RastriyaSenaa</a><a class="side-link" href="index.html">Dashboard</a><a class="side-link" href="products.html">Products</a><a class="side-link" href="orders.html">Orders</a><a class="side-link active" href="admins.html">Admins</a><a class="side-link" href="settings.html">Settings</a><a class="side-link" href="../index.html">← Store</a></aside>
<main class="admin-main"><div class="admin-top"><div><h1 style="margin:0">Admin Management</h1><span class="muted">Sirf Super Admin admin accounts manage kar sakta hai.</span></div><button class="btn btn-dark" onclick="logoutAdmin()">Logout</button></div>
<div id="guardMsg" class="form-card" style="display:none"></div>
<div id="content" style="display:none">
<div class="form-card" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h3 style="margin:0 0 6px">Admin List</h3><p class="muted" style="margin:0">Password kabhi list mein show nahi hoga.</p></div><button class="btn btn-primary" id="addBtn">+ Add Normal Admin</button></div></div>
<div class="table-wrap"><table><thead><tr><th>Admin ID</th><th>Role</th><th>Permissions</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="adminRows"></tbody></table></div>
</div></main></div>
<div id="modal" class="modal"><div class="modal-card"><h2>Create Normal Admin</h2><form id="form"><div class="form-grid"><div><label>Admin ID</label><input id="newUser" class="input" required></div><div><label>Password</label><input id="newPass" class="input" type="password" minlength="6" required></div><div class="full"><label>Permissions</label><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px"><label><input type="checkbox" id="permProducts" checked> Products</label><label><input type="checkbox" id="permOrders" checked> Orders</label></div></div><div class="full"><button class="btn btn-primary">Create Admin</button> <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button></div><div class="full"><p id="msg"></p></div></div></form></div></div>
<script src="../js/app.js"></script><script>
const me=requireAdmin();
const content=document.getElementById('content'), guard=document.getElementById('guardMsg');
if(me && String(me.role).toLowerCase()==='superadmin'){content.style.display='block';loadAdmins();}else{guard.style.display='block';guard.innerHTML='<h3>Access denied</h3><p class="muted">Admin Management sirf Super Admin ke liye available hai.</p>';}
async function loadAdmins(){
 adminRows.innerHTML='<tr><td colspan="6">Admin list load ho rahi hai...</td></tr>';
 try{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  const r=await fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getAdmins',token:adminToken()}),signal:controller.signal});
  clearTimeout(timer);
  if(!r.ok) throw new Error('API HTTP error: '+r.status);
  const data=await r.json();
  if(!data.ok) throw new Error(data.error||'Admin list API failed');
  adminRows.innerHTML=(data.admins||[]).map(a=>{const self=String(a.username).toLowerCase()===String(me.username).toLowerCase();const status=String(a.status||'Active')==='Active';return '<tr><td><b>'+esc(a.username)+'</b></td><td>'+esc(a.role)+'</td><td>'+esc(a.permissions)+'</td><td><span class="tag">'+esc(a.status)+'</span></td><td>'+esc(a.createdAt)+'</td><td style="white-space:nowrap">'+(self?'<span class="muted">Current account</span>':'<button class="btn btn-outline btn-sm" onclick="toggleAdmin(\''+js(a.username)+'\',\''+(status?'Disabled':'Active')+'\')">'+(status?'Disable':'Enable')+'</button> <button class="btn btn-sm" style="background:#dc2626;color:#fff" onclick="deleteAdminAccount(\''+js(a.username)+'\')">Delete</button>')+'</td></tr>'}).join('')||'<tr><td colspan="6">No admins found.</td></tr>';
 }catch(e){
  const msg=e.name==='AbortError'?'API response timeout (15 sec). Apps Script deployment/API URL check karein.':e.message;
  adminRows.innerHTML='<tr><td colspan="6" style="color:#dc2626">'+esc(msg)+'</td></tr>';
 }
}
async function toggleAdmin(username,status){if(!confirm('Admin '+username+' ko '+status+' karna hai?'))return;try{await apiPost({action:'updateAdminStatus',token:adminToken(),username,status});loadAdmins();}catch(e){alert(e.message)}}
async function deleteAdminAccount(username){if(!confirm('WARNING: '+username+' ko permanently delete karna hai?'))return;try{await apiPost({action:'deleteAdmin',token:adminToken(),username});loadAdmins();}catch(e){alert(e.message)}}
document.getElementById('addBtn').onclick=()=>document.getElementById('modal').classList.add('open');document.getElementById('cancelBtn').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const perms=[];if(permProducts.checked)perms.push('products');if(permOrders.checked)perms.push('orders');try{await apiPost({action:'createAdmin',token:adminToken(),admin:{username:newUser.value.trim(),password:newPass.value,permissions:perms.join(',')}});e.target.reset();permProducts.checked=permOrders.checked=true;document.getElementById('modal').classList.remove('open');loadAdmins();}catch(err){msg.textContent=err.message}};
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function js(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
</script></body></html>
