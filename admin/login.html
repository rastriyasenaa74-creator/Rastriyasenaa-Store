<!doctype html><html><head><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | RastriyaSenaa Store</title><link rel="stylesheet" href="../css/style.css"></head><body><section class="section"><div class="container" style="max-width:420px"><div class="form-card"><div class="logo"><span class="logo-mark">RS</span>RastriyaSenaa</div><h2>Admin Login</h2><form id="adminLoginForm"><label>Admin ID</label><input id="username" class="input" required autocomplete="username"><br><br><label>Password</label><input id="password" class="input" type="password" required autocomplete="current-password"><br><br><button class="btn btn-dark" style="width:100%">Login</button><p id="err" style="color:#dc2626"></p></form>
<script>
document.getElementById('adminLoginForm').onsubmit=async e=>{
 e.preventDefault(); const err=document.getElementById('err'); err.textContent='';
 if(!window.API_URL){localStorage.setItem('rs_admin','1');location.href='index.html';return}
 try{
  const r=await fetch(window.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'adminLogin',username:username.value,password:password.value})});
  const x=await r.json(); if(!x.ok) throw new Error(x.error||'Login failed');
  localStorage.setItem('rs_admin',JSON.stringify({token:x.token,...x.admin})); location.href='index.html';
 }catch(e){err.textContent=e.message}
}
</script><p class="muted" style="font-size:12px;margin-top:15px">Production me credentials Google Sheets/backend authentication se validate karein.</p></div></div></section><script src="../js/app.js"></script></body></html>
