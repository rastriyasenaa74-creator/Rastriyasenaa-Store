<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Admin Login | RastriyaSenaa Store</title><link rel="stylesheet" href="../css/style.css"></head><body>
<section class="section"><div class="container" style="max-width:420px"><div class="form-card"><div class="logo"><span class="logo-mark">RS</span>RastriyaSenaa</div><h2>Admin Login</h2>
<form id="adminLoginForm"><label>Admin ID</label><input id="username" class="input" required autocomplete="username"><br><br><label>Password</label><input id="password" class="input" type="password" required autocomplete="current-password"><br><br><button id="loginBtn" class="btn btn-dark" style="width:100%">Login</button><p id="err" style="color:#dc2626"></p></form>
</div></div></section>
<script src="../js/app.js"></script>
<script>
document.getElementById('adminLoginForm').onsubmit=async function(e){
 e.preventDefault();
 const err=document.getElementById('err'),btn=document.getElementById('loginBtn');
 err.textContent='';btn.disabled=true;btn.textContent='Checking...';
 try{
  const x=await apiPost({action:'adminLogin',username:document.getElementById('username').value.trim(),password:document.getElementById('password').value});
  localStorage.setItem('rs_admin',JSON.stringify({token:x.token,...x.admin}));
  location.replace('index.html');
 }catch(ex){err.textContent=ex.message}
 finally{btn.disabled=false;btn.textContent='Login'}
};
</script></body></html>
