<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Products | RastriyaSenaa Store Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-shell"><aside class="sidebar"><a class="logo" href="../index.html"><span class="logo-mark">RS</span>RastriyaSenaa</a><a class="side-link" href="index.html">Dashboard</a><a class="side-link active" href="products.html">Products</a><a class="side-link" href="orders.html">Orders</a><a class="side-link" href="admins.html">Admins</a><a class="side-link" href="settings.html">Settings</a></aside><main class="admin-main"><div class="admin-top"><div><h1 style="margin:0">Products</h1><span class="muted">Add products with secure Google Drive image upload</span></div><button class="btn btn-dark" id="logoutBtn">Logout</button><button class="btn btn-primary" onclick="document.getElementById('modal').classList.add('open')">+ Add Product</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<div id="modal" class="modal"><div class="modal-card"><h2>Add Product</h2><form id="productForm"><div class="form-grid"><div><label>Product Name</label><input id="pname" class="input" required></div><div><label>Category</label><input id="pcat" class="input" required></div><div><label>Price</label><input id="pprice" class="input" type="number" min="0" required></div><div><label>Discount Price</label><input id="pdiscount" class="input" type="number" min="0"></div><div><label>Stock</label><input id="pstock" class="input" type="number" min="0" required></div><div><label>Badge</label><input id="pbadge" class="input" placeholder="New / Bestseller"></div><div class="full"><label>Product Image</label><input id="pimage" class="input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><small class="muted">Max 5 MB.</small><div id="preview" style="margin-top:10px"></div></div><div class="full"><label>Description</label><textarea id="pdesc" class="textarea" rows="3"></textarea></div><div class="full"><button class="btn btn-primary" id="saveBtn">Upload & Save Product</button><button type="button" class="btn btn-outline" onclick="document.getElementById('modal').classList.remove('open')">Cancel</button></div><div class="full"><p id="msg"></p></div></div></form></div></div>
<script src="../js/app.js"></script><script>
(function(){const s=requireAdmin();if(!s)return;document.getElementById('logoutBtn').onclick=logoutAdmin;const file=document.getElementById('pimage'),preview=document.getElementById('preview');file.addEventListener('change',()=>{const f=file.files[0];if(f)preview.innerHTML='<img src="'+URL.createObjectURL(f)+'" style="width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #e5e7eb">';});
async function refresh(){const ps=await loadProducts();document.getElementById('rows').innerHTML=ps.map(p=>'<tr><td>'+p.id+'</td><td><b>'+p.name+'</b></td><td>'+p.category+'</td><td>'+money(p.discount||p.price)+'</td><td>'+p.stock+'</td><td>'+String(p.status||'Active')+'</td></tr>').join('');}
refresh();
document.getElementById('productForm').onsubmit=async function(e){e.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('saveBtn'),f=file.files[0];if(!f){msg.textContent='Image select karein.';return}btn.disabled=true;btn.textContent='Uploading...';try{const up=await uploadProductImage(f);await apiPost({action:'createProduct',token:adminToken(),product:{name:document.getElementById('pname').value,category:document.getElementById('pcat').value,price:Number(document.getElementById('pprice').value),discount:Number(document.getElementById('pdiscount').value)||'',stock:Number(document.getElementById('pstock').value)||0,image:up.url,description:document.getElementById('pdesc').value,badge:document.getElementById('pbadge').value,status:'Active'}});msg.textContent='Product successfully added.';e.target.reset();preview.innerHTML='';await refresh();setTimeout(()=>document.getElementById('modal').classList.remove('open'),600)}catch(err){msg.textContent=err.message}finally{btn.disabled=false;btn.textContent='Upload & Save Product'}};
})();
</script></body></html>
