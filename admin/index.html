<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Admin Panel | RastriyaSenaa Store</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="admin-shell"><aside class="sidebar"><a class="logo" href="../index.html"><span class="logo-mark">RS</span>RastriyaSenaa</a><a class="side-link active" href="index.html">Dashboard</a><a class="side-link" href="products.html">Products</a><a class="side-link" href="orders.html">Orders</a><a class="side-link" href="admins.html">Admins</a><a class="side-link" href="settings.html">Settings</a><a class="side-link" href="../index.html">← Store</a></aside>
<main class="admin-main"><div class="admin-top"><div><h1 style="margin:0">Dashboard</h1><span class="muted">RastriyaSenaa Store management</span></div><button class="btn btn-dark" id="logoutBtn">Logout</button></div>
<div class="stat-grid"><div class="stat"><small>Total Products</small><b id="pcount">0</b></div><div class="stat"><small>Orders</small><b id="ocount">0</b></div><div class="stat"><small>Customers</small><b id="ccount">0</b></div><div class="stat"><small>Admin</small><b id="who">-</b></div></div>
<div class="form-card"><h3>Quick Actions</h3><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-primary" href="products.html">+ Add Product</a><a class="btn btn-outline" href="orders.html">Manage Orders</a><a class="btn btn-outline" href="admins.html">Manage Admins</a></div></div></main></div>
<script src="../js/app.js"></script><script>
(async function(){const s=requireAdmin();if(!s)return;document.getElementById('who').textContent=s.username+' ('+s.role+')';document.getElementById('logoutBtn').onclick=logoutAdmin;try{const p=await loadProducts();document.getElementById('pcount').textContent=p.length}catch(e){}})();
</script></body></html>
