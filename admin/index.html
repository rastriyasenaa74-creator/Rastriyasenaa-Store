<!doctype html><html lang="en"><head><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><script>
(function(){
  try{
    const raw=localStorage.getItem('rs_admin');
    if(!raw) { window.location.replace('login.html'); return; }
    const a=JSON.parse(raw);
    if(!a || !a.username){ localStorage.removeItem('rs_admin'); window.location.replace('login.html'); }
  }catch(e){
    localStorage.removeItem('rs_admin');
    window.location.replace('login.html');
  }
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | RastriyaSenaa Store</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="admin-shell"><aside class="sidebar"><a class="logo" href="../index.html"><span class="logo-mark">RS</span>RastriyaSenaa</a><a class="side-link active" href="index.html">Dashboard</a><a class="side-link" href="products.html">Products</a><a class="side-link" href="orders.html">Orders</a><a class="side-link" href="admins.html">Admins</a><a class="side-link" href="settings.html">Settings</a><a class="side-link" href="../index.html">← Store</a></aside>
<main class="admin-main"><div class="admin-top"><div><h1 style="margin:0">Dashboard</h1><span class="muted">RastriyaSenaa Store management</span></div><button class="btn btn-dark" onclick="apiPost({action:'adminLogout',token:adminToken()}).catch(()=>{}).finally(()=>{localStorage.removeItem('rs_admin');window.location.replace('login.html')})">Logout</button></div>
<div class="stat-grid"><div class="stat"><small>Total Products</small><b id="pcount">0</b></div><div class="stat"><small>Orders</small><b>0</b></div><div class="stat"><small>Customers</small><b>0</b></div><div class="stat"><small>Admins</small><b>1</b></div></div>
<div class="form-card"><h3>Quick Actions</h3><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-primary" href="products.html">+ Add Product</a><a class="btn btn-outline" href="orders.html">Manage Orders</a><a class="btn btn-outline" href="admins.html">Manage Admins</a></div></div></main></div><script src="../js/app.js"></script><script>loadProducts().then(p=>pcount.textContent=p.length)</script></body></html>
