<!doctype html><html><head><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><script>
(function(){
  try{
    const raw=localStorage.getItem('rs_admin');
    if(!raw) { window.location.replace('login.html'); return; }
    const a=JSON.parse(raw);
    if(!a || !a.username){ localStorage.removeItem('rs_admin'); window.location.replace('login.html'); }
  }catch(e){
    localStorage.removeItem('rs_admin');
    window.location.replace('login.html');
  }
})();
