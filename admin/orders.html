<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Orders | Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="admin-shell"><aside class="sidebar"><a class="logo" href="../index.html"><span class="logo-mark">RS</span>RastriyaSenaa</a><a class="side-link" href="index.html">Dashboard</a><a class="side-link" href="products.html">Products</a><a class="side-link active" href="orders.html">Orders</a><a class="side-link" href="admins.html">Admins</a><a class="side-link" href="settings.html">Settings</a></aside><main class="admin-main"><div class="admin-top"><h1 style="margin:0">Orders</h1><button class="btn btn-dark" id="logoutBtn">Logout</button></div><p id="msg" class="muted">Loading...</p><div class="table-wrap"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Mobile</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="orderRows"></tbody></table></div></main></div><script src="../js/app.js"></script><script>
(async function(){const s=requireAdmin();if(!s)return;document.getElementById('logoutBtn').onclick=logoutAdmin;
async function load(){try{const x=await apiPost({action:'getOrders',token:adminToken()});const list=x.orders||[];document.getElementById('orderRows').innerHTML=list.map(o=>{const id=String(o.orderId||'').replace(/'/g,"\\'");return '<tr><td>'+o.orderId+'</td><td>'+o.customerName+'</td><td>'+o.mobile+'</td><td>'+money(o.total)+'</td><td>'+o.status+'</td><td><select onchange="setStatus(\\''+id+'\\',this.value)" class="select"><option '+(o.status==='Pending'?'selected':'')+'>Pending</option><option '+(o.status==='Confirmed'?'selected':'')+'>Confirmed</option><option '+(o.status==='Shipped'?'selected':'')+'>Shipped</option><option '+(o.status==='Delivered'?'selected':'')+'>Delivered</option><option '+(o.status==='Cancelled'?'selected':'')+'>Cancelled</option></select></td></tr>'}).join('');document.getElementById('msg').textContent=list.length+' order(s)'}catch(e){document.getElementById('msg').textContent=e.message}}
window.setStatus=async function(id,status){try{const x=await apiPost({action:'updateOrderStatus',token:adminToken(),orderId:id,status:status});alert(x.message||'Updated');load()}catch(e){alert(e.message)}};load();})();
</script></body></html>
